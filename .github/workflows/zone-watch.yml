name: Zone watch

on:
  schedule:
    # เวลาไทย จันทร์–ศุกร์: ทุก 15 นาที 06:00–17:59 (ช่วงที่เทรดได้ผลดีสุด) และทุก 30 นาที 18:00–23:59
    # ไม่แจ้งเตือนช่วง 00:00–04:59 น. (เวลานอน) · ทุกข้อความส่งแบบไม่มีเสียงเตือน
    # ประมาณ 60 รอบ/วัน (repo สาธารณะ: นาที Actions ไม่จำกัด)
    - cron: "*/15 23 * * 0-4"
    - cron: "*/15 0-10 * * 1-5"
    - cron: "*/30 11-16 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "ทดสอบส่ง LINE แจ้งเตือนไฮเดิมทันที"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zone-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: เช็กราคาเทียบโซน
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python3 zone_watch.py

      - name: เช็กราคาใกล้ไฮเดิม (วิธี Short ที่ไฮเดิม)
        if: always()
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TEST_SEND: ${{ inputs.test && '1' || '' }}
        run: python3 prev_high_watch.py

      - name: จำว่าแจ้งเตือนไปแล้ว
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          for f in data/watch_state.json data/prev_high_state.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "watch $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash -q && git push -q
