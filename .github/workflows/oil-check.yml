name: Oil source check (temporary)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test levels.py oil loader
        run: |
          python - <<'EOF'
          import levels, pandas as pd
          d = levels.from_yahoo_hourly("CL=F")
          print(d.round(2).tail(6).to_string())
          EOF
