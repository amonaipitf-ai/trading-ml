name: LINE morning brief

on:
  schedule:
    # 21:40 UTC = 04:40 น. เวลาไทย ทุกวัน (GitHub ดีเลย์ราว 10–30 นาที ข้อความจึงถึงราว 04:50–05:10)
    - cron: "40 21 * * *"
  workflow_dispatch: {}  # กดส่งทดสอบเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: line-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: แนวรับ-แนวต้านล่าสุด
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python levels.py

      - name: ส่งสรุปเข้า LINE (และบันทึกแผน/วัดผลแผนรอบก่อน)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python line_brief.py

      - name: บันทึกแผนและผล
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          for f in data/plan_today.json data/plan_results.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "plan $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -q && git push -q
