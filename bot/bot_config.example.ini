; คัดลอกไฟล์นี้เป็น bot_config.ini แล้วแก้ค่า (bot_config.ini จะไม่ถูกอัปโหลดขึ้น GitHub)
; ไม่ต้องใส่เลขบัญชีหรือรหัสผ่าน — บอทใช้บัญชีที่ล็อกอินอยู่ในโปรแกรม MT5

[bot]
; ชื่อสัญลักษณ์ทองในบัญชี Exness ของคุณ (ดูใน Market Watch เช่น XAUUSDm, XAUUSD)
symbol = XAUUSDm
; เสี่ยงต่อไม้ เป็น % ของ equity (แนะนำ 0.5)
risk_pct = 0.5
; lot สูงสุดต่อไม้ (กันพลาด)
max_lot = 1.0
; true = แค่บันทึกว่าจะทำอะไร ไม่ส่งออร์เดอร์จริง (เริ่มด้วย true 2-3 วัน แล้วค่อยเปลี่ยนเป็น false)
dry_run = true
; false = บอทไม่ยอมทำงานบนบัญชีเงินจริง (ห้ามเปลี่ยนจนกว่าผล Demo จะผ่าน)
allow_real = false
; ที่อยู่ไฟล์ terminal64.exe ถ้าเครื่องมี MT5 หลายตัว (ว่างไว้ได้)
terminal_path =

[line]
; token เดียวกับที่ใช้ใน GitHub Secrets LINE_CHANNEL_ACCESS_TOKEN (ว่างไว้ = ไม่ส่ง LINE)
channel_access_token =
; User ID ผู้รับ (U...) ว่างไว้ = broadcast
to =
